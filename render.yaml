# Render Blueprint for the API (design.md Phase 5). Database is Supabase Postgres.
services:
  - type: web
    name: instahub-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Free instances have no pre-deploy step, so migrations run on boot (idempotent, so
    # restarts are safe). The demo seed is for local development only.
    startCommand: .venv/bin/python -m scripts.migrate && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Liveness only: /health also pings Postgres and Redis, and Render probes often
    # enough that it would spend the Upstash free tier's command quota.
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false # Supabase session pooler connection string
      - key: REDIS_URL
        sync: false # Upstash rediss:// URL: like-count cache + live updates; blank turns both off
      - key: COUNTER_MODE
        value: direct # "buffered" needs REDIS_URL; its flusher polls Redis every 2s (see README)
      - key: FEED_MODE
        value: read # "write" (fan-out on write) needs REDIS_URL; see loadtest/FEED.md
      - key: CORS_ORIGINS
        sync: false # e.g. https://my-instahub.vercel.app
      - key: SUPABASE_URL
        sync: false # https://<project-ref>.supabase.co
      - key: SUPABASE_JWT_SECRET
        sync: false # only for projects on the legacy JWT secret; else leave blank
      - key: S3_ENDPOINT
        sync: false # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto # R2's region name
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false # e.g. instahub
      - key: IMAGE_BASE_URL
        sync: false # bucket's public URL, e.g. https://pub-xxxx.r2.dev
