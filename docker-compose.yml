# Local dev stack: stands in for Supabase Postgres and Upstash Redis.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: instahub
      POSTGRES_PASSWORD: instahub
      POSTGRES_DB: instahub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instahub -d instahub"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
