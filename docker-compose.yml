# Local dev stack: stands in for Supabase Postgres, Upstash Redis and Cloudflare R2.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: instahub
      POSTGRES_PASSWORD: instahub
      POSTGRES_DB: instahub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instahub -d instahub"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # S3-compatible stand-in for Cloudflare R2 (in-memory: objects vanish when it restarts).
  # `make up` creates the bucket with the same CORS and public-read setup R2 needs.
  s3:
    image: motoserver/moto:5.2.3
    ports:
      - "9000:5000"

volumes:
  pgdata:
